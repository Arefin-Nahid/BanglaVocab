<meta name="claude:viewport-fit-sides" content="cover">
<title>বাংলা শব্দভাণ্ডার</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap">
<style>
/* Layout: sticky top bar with tabs (bottom tab bar on phones), one centered column of cards, full-screen focus view for study sessions. */
:root{
  --bg:#f1f5f2; --surface:#fafcfa; --surface2:#e6eee9; --ink:#1d2b26; --muted:#5a6d65; --line:#d3dfd8;
  --accent:#2f7d68; --accent-ink:#ffffff; --accent-soft:#dff0e8; --pri:#6fbf9d; --pri-ink:#052d20; --pri-line:#58a785;
  --good:#5a8f29; --good-soft:#e6f0d8; --warn:#8f6511; --warn-soft:#f7ecd1; --bad:#b3402f; --bad-soft:#f9e3de;
  --shadow:0 1px 2px rgba(29,43,38,.05),0 2px 8px rgba(29,43,38,.04);
  --ff-ui:'Hind Siliguri',system-ui,'Segoe UI','Noto Sans Bengali',sans-serif;
  --ff-q:'Noto Serif Bengali','Hind Siliguri',Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0c0c; --surface:#161616; --surface2:#212121; --ink:#ececec; --muted:#9b9b9b; --line:#2d2d2d;
  --accent:#6fcfae; --accent-ink:#06190f; --accent-soft:#1d2b25; --pri:#2a4a3d; --pri-ink:#a6e6c8; --pri-line:#3a6150;
  --good:#a3d46c; --good-soft:#232b1a; --warn:#e6b45c; --warn-soft:#2f2a1a; --bad:#f08c7c; --bad-soft:#33201e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0c; --surface:#161616; --surface2:#212121; --ink:#ececec; --muted:#9b9b9b; --line:#2d2d2d;
  --accent:#6fcfae; --accent-ink:#06190f; --accent-soft:#1d2b25; --pri:#2a4a3d; --pri-ink:#a6e6c8; --pri-line:#3a6150;
  --good:#a3d46c; --good-soft:#232b1a; --warn:#e6b45c; --warn-soft:#2f2a1a; --bad:#f08c7c; --bad-soft:#33201e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--ff-ui);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .bt{font:700 18px/1.2 var(--ff-q);letter-spacing:.01em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;flex:none}.logo .bg{fill:var(--pri)}.logo .lgl{fill:none;stroke:var(--pri-ink);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.brand small{display:block;font:500 11px/1.2 var(--ff-ui);color:var(--muted);letter-spacing:.04em}
nav.tabs{display:flex;gap:2px;order:2}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}
nav.tabs button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
.m-only{display:none}
.tools{display:flex;gap:6px;order:3;flex:none}
.ib{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
main{padding-block:20px 56px;display:flex;flex-direction:column;gap:14px}
h1{font:700 26px/1.3 var(--ff-q);margin:0;text-wrap:balance}
h2{font:700 17px/1.4 var(--ff-ui);margin:0 0 12px}
h3{font:600 15px/1.4 var(--ff-ui);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card.flat{box-shadow:none}
.lift{box-shadow:var(--shadow)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font:700 28px/1.2 var(--ff-ui);font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 16px;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri-line)}
.btn.pri:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn.sm{min-height:34px;padding:5px 14px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;min-height:32px;color:var(--ink)}
button.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri-line);font-weight:600}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;background:var(--surface2);color:var(--muted);font-weight:500}
.tag.new{background:var(--surface2)}.tag.learning{background:var(--warn-soft);color:var(--warn)}
.tag.review{background:var(--accent-soft);color:var(--accent)}.tag.mastered{background:var(--good-soft);color:var(--good)}
.tag.diff{background:var(--bad-soft);color:var(--bad)}.tag.unc{background:var(--warn-soft);color:var(--warn)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.stack i{display:block;height:100%}
.c-new{background:var(--line)}.c-learning{background:var(--warn)}.c-review{background:var(--accent)}.c-mastered{background:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cats{display:flex;flex-direction:column;gap:14px}
.cats .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:baseline}
.cats .r .b2{grid-column:1/-1}
.cats .r .stack{height:10px}
.num{font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;border-bottom:1px solid var(--line);padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.bars i{display:block;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.bars i.n{background:var(--good)}
.axis{display:flex;gap:6px;font-size:11px;color:var(--muted)}
.axis span{flex:1;text-align:center;min-width:0;overflow:hidden}
.hero{display:grid;gap:18px;grid-template-columns:1.4fr 1fr;align-items:center}
.hero .big{font:700 40px/1.1 var(--ff-ui);font-variant-numeric:tabular-nums}
.fieldset{display:flex;flex-direction:column;gap:6px}
label.f{font-size:13px;color:var(--muted);font-weight:500}
select,input[type=date],input[type=text],input[type=search],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;max-width:100%}
textarea{width:100%;min-height:92px;resize:vertical}
input[type=search],input[type=text]{width:100%}
.switch{display:flex;gap:10px;align-items:center}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.list{display:flex;flex-direction:column}
.item{border-top:1px solid var(--line);padding:12px 2px;cursor:pointer;display:grid;gap:4px}
.item:first-child{border-top:0}
.item .l1{display:flex;gap:12px;justify-content:space-between;align-items:baseline}
.item .q{font:600 17px/1.45 var(--ff-q);min-width:0;overflow-wrap:anywhere}
.item .a{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .det{background:var(--surface2);border-radius:10px;padding:12px;margin-top:6px;display:grid;gap:8px;cursor:default}
.tags{display:flex;gap:6px;flex-wrap:wrap;list-style:none;padding:0;margin:0}
.tags li{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:3px 10px;font-size:16px;overflow-wrap:anywhere}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.r,th.r{text-align:right}
.ok{color:var(--good);font-weight:600}.badc{color:var(--bad);font-weight:600}
.mode{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mode p{color:var(--muted);font-size:14px}
/* home */
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tiles3 .tile{padding:12px 12px}
.tiles3 .k{font-size:13px;line-height:1.35}
.tiles3 .v{font-size:24px}
.tiles3 .s{font-size:12px;line-height:1.4}
.hello{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero2{display:grid;gap:14px;padding:16px}
.hhead{display:flex;gap:12px 16px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.hero2 .big{font:700 26px/1.3 var(--ff-q)}
.prog.thick{height:10px;border-radius:5px}
.b2{display:flex;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.b2 i{display:block;height:100%}.b2 .l{background:var(--accent)}.b2 .s{background:var(--pri)}
.c-learned{background:var(--accent)}.c-seen{background:var(--pri)}
/* today */
.today{padding:14px 16px;display:grid;gap:14px}
.tstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.ts{padding:0 12px;border-left:1px solid var(--line);min-width:0}
.ts:first-child{border-left:0;padding-left:0}
.ts .v{font:700 26px/1.25 var(--ff-ui);font-variant-numeric:tabular-nums}
.ts .k{font-size:14px;line-height:1.35;white-space:nowrap}
.ts .s{font-size:12px;line-height:1.4;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar{display:flex;gap:10px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note{padding:12px 16px}
.note ul{margin:0;padding-left:18px;display:grid;gap:2px;font-size:14px;color:var(--muted)}
/* profile */
.prof-card{display:grid;gap:14px}
.prof{display:flex;gap:14px;align-items:center}
.av{width:60px;height:60px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--pri);color:var(--pri-ink);flex:none;font:700 24px var(--ff-ui)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.anon{background:var(--surface2);color:var(--muted)}
.av svg{width:58%;height:58%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.pi{min-width:0}.pn{font:700 18px/1.35 var(--ff-q);overflow-wrap:anywhere}.pm{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.sync{display:inline-flex;gap:8px;align-items:center;border-radius:999px;padding:4px 12px;font-size:13px;background:var(--surface2);color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.s-synced{background:var(--good-soft);color:var(--good)}.s-synced i{background:var(--good)}
.s-syncing,.s-connecting{background:var(--warn-soft);color:var(--warn)}.s-syncing i,.s-connecting i{background:var(--warn);animation:pulse 1.2s ease-in-out infinite}
.s-error{background:var(--bad-soft);color:var(--bad)}.s-error i{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.gbtn{display:flex;gap:12px;align-items:center;justify-content:center;width:100%;min-height:48px;border:1px solid #dadce0;background:#fff;color:#1f1f1f;border-radius:12px;font-weight:600;padding:8px 16px}
.gbtn svg{width:20px;height:20px;flex:none}.gbtn[disabled]{opacity:.6;cursor:not-allowed}
.btn.out{border-color:var(--bad);color:var(--bad);display:inline-flex;gap:8px;align-items:center}
.warnbox{background:var(--bad-soft);border-radius:12px;padding:12px 14px;display:grid;gap:10px;font-size:14px}
/* steps + reading list */
.step{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px 12px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.step .more{grid-column:2/-1}
.link{background:none;border:0;padding:4px 0;min-height:32px;color:var(--accent);font-weight:600;font-size:14px;text-align:left}
.link:hover{text-decoration:underline}
.step .sn{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 14px/26px var(--ff-ui);text-align:center;flex:none}
.step .sb{min-width:0;display:grid;gap:2px}
.lnl{list-style:none;margin:0;padding:0}
.ln{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.ln:first-child{border-top:0}
.ln .no{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 13px/28px var(--ff-ui);text-align:center;font-variant-numeric:tabular-nums}
.ln .lb{display:grid;gap:3px;min-width:0}
.ln .q{font:700 18px/1.5 var(--ff-q);overflow-wrap:anywhere}
.ln .a{font:500 16px/1.65 var(--ff-q);overflow-wrap:anywhere}
.ln .acts{display:flex;align-items:center;gap:2px}
.chk{width:32px;height:32px;min-height:32px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--pri-ink);font:700 16px/1 var(--ff-ui);padding:0;display:grid;place-items:center}
.chk.on{background:var(--pri);border-color:var(--pri-line)}
.ln.rd .q{color:var(--muted)}
.rdbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;margin:2px 2px 8px;color:var(--muted)}
.rdbar b{color:var(--ink)}
.ln .hide{justify-self:start;background:var(--surface2);color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 12px;font-size:14px;min-height:36px}
.dock{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);z-index:20}
.dock .btn{flex:1 1 140px}
/* search */
.sbox{padding:12px;display:grid;gap:8px}
.sbox input[type=search]{min-height:42px;padding:6px 14px;border-radius:12px}
.filters{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,1fr);gap:8px}
.filters select{width:100%;min-height:36px;padding:4px 8px;font-size:14px;border-radius:10px;text-overflow:ellipsis}
.cnt{margin:0 0 4px}
.item{grid-template-columns:12px minmax(0,1fr);gap:0 12px;align-items:start}
.item .dot{width:11px;height:11px;border-radius:50%;margin-top:9px}
.item .body{display:grid;gap:2px;min-width:0}
.item .q{font:700 17px/1.5 var(--ff-q)}
.item .a{color:var(--ink);font-size:15px}
.item .tag.cat{background:var(--accent-soft);color:var(--accent)}
/* study session */
body.focus header.top nav.tabs{display:none}
.stage{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;width:100%}
.sess-top{display:flex;gap:12px;align-items:center}
.prog{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-height:260px}
.fc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fc-prompt{color:var(--muted);font-size:14px}
.fc-q{font:700 28px/1.5 var(--ff-q);overflow-wrap:anywhere;text-wrap:balance}
.fc-a{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.fc-a .ans{font:600 22px/1.55 var(--ff-q);overflow-wrap:anywhere}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rates button{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:58px}
.rates button span{font-size:12px;color:var(--muted);font-weight:400}
.rates.three{grid-template-columns:repeat(3,1fr)}
.rates.three button{min-height:60px;font-size:15px;font-weight:600}
.rates.two{grid-template-columns:1fr 1fr}
.rates.two button{min-height:52px;font-size:16px;font-weight:600}
.rates .r1{border-color:var(--bad);color:var(--bad)}.rates .r3{border-color:var(--warn);color:var(--warn)}
.rates .r4{border-color:var(--accent);color:var(--accent)}.rates .r5{border-color:var(--good);color:var(--good)}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font:500 18px/1.5 var(--ff-q);display:flex;gap:12px;align-items:baseline;min-height:50px}
.opt kbd{font:600 12px var(--ff-ui);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.res{border-radius:10px;padding:10px 14px;font-weight:600}
.res.good{background:var(--good-soft);color:var(--good)}.res.bad{background:var(--bad-soft);color:var(--bad)}.res.warn{background:var(--warn-soft);color:var(--warn)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font:500 17px/1.45 var(--ff-q);text-align:left;min-height:52px;overflow-wrap:anywhere}
.match button.sel{border-color:var(--accent);background:var(--accent-soft)}
.match button.done{border-color:var(--good);background:var(--good-soft);opacity:.7}
.match button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.star{background:none;border:0;font-size:20px;line-height:1;color:var(--muted);padding:4px 8px;min-height:32px}
.star.on{color:var(--warn)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
.hint{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  header.top .in{min-height:52px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;order:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around;z-index:25}

<script>
(function(){
'use strict';
var DATA=JSON.parse(document.getElementById('data').textContent);

var ENTRIES=DATA.entries, CATS=DATA.cats;
var BYID={}, CATBY={};
var PARENT={syn2:'syn',sound:'onew',idiomgrp:'idiom'};
function P(c){return PARENT[c]||c;}
var DISPCATS=CATS.filter(function(c){return !PARENT[c.id];});
ENTRIES.forEach(function(e){BYID[e.id]=e;});
CATS.forEach(function(c){CATBY[c.id]=c;});

/* ---------- helpers ---------- */
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function dayIdx(t){t=t||Date.now();return Math.floor((t-new Date(t).getTimezoneOffset()*60000)/86400000);}
function lev(a,b){var m=a.length,n=b.length;if(!m)return n;if(!n)return m;var p=[],i,j;for(j=0;j<=n;j++)p[j]=j;for(i=1;i<=m;i++){var c=[i];for(j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));}p=c;}return p[n];}

/* ---------- state ---------- */

  set:{lang:'bn',theme:'auto',newPerDay:20,order:'source',interleave:true,recall:false,dir:'forward',maxReviews:120}};}

function L(bn,en){return ST.set.lang==='bn'?bn:en;}

/* ---------- derived entry data ---------- */
var ORDER_L='অআইঈউঊঋএঐওঔকখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমযরলশষসহৎ'.split('');
function canRev(e){return e.cat==='ant'||e.cat==='term';}
function altsOf(str){var out=[];String(str).split('/').forEach(function(p){var n=norm(p);if(n)out.push(n);if(/\(/.test(p)){var s=norm(p.replace(/\(.*?\)/g,''));if(s)out.push(s);}});return out;}
var VALID={};
function vadd(k,arr){var s=VALID[k]||(VALID[k]=new Set());arr.forEach(function(x){s.add(x);});}
ENTRIES.forEach(function(e){
  e._nq=norm(e.q);e._na=norm(e.a);

});

/* ---------- memory model (SM-2 + 1/3/7/14/30 ladder + Leitner box) ---------- */
var LADDER=[1,3,7,14,30];
function sched(c0,q,today){
  var c=Object.assign({s:0,ef:2.5,iv:0,l:0,b:1,due:today,last:today},c0||{});
  var wasNew=!c0||!c0.n, due=wasNew||c.due<=today;
  if(q<3){c.l=(c.l||0)+1;c.s=0;c.iv=0;c.b=1;c.ef=Math.max(1.3,c.ef-0.2);c.due=today;c.last=today;return c;}
  if(q>=4)c.b=Math.min(5,(c.b||1)+1);

}

  lg.r++;if(q>=3)lg.c++;if(wasNew){if(extra)lg.x=(lg.x||0)+1;else lg.n++;}lg.ms+=ms;
  var k=wasNew?'n':'r';ST.tm[k].ms+=ms;ST.tm[k].c++;
  save();cloudCard(id);cloudDay(today,{r:1,c:q>=3?1:0,n:(wasNew&&!extra)?1:0,x:(wasNew&&extra)?1:0,ms:ms});stateDirty();return c;
}
function status(id){var c=ST.cards[id];if(!c||!c.n)return 'new';if(c.s>=5||c.iv>=21)return 'mastered';if(c.s>=3)return 'review';return 'learning';}

function isDifficult(id){var c=ST.cards[id];return !!(c&&((c.n&&(c.l>=2||c.ef<2.0||(c.n>=3&&c.c/c.n<0.6)))||c.star));}

/* ---------- planner ---------- */
var ORDER_CACHE={k:'',v:[]};
function getOrder(){
  if(ORDER_CACHE.k===ST.set.order)return ORDER_CACHE.v;
  var ids;
  if(ST.set.order==='source')ids=ENTRIES.map(function(e){return e.id;});
  else{var by={},arr=[];ENTRIES.forEach(function(e){(by[e.cat]=by[e.cat]||[]).push(e);});
    Object.keys(by).forEach(function(k,ci){by[k].forEach(function(e,i){arr.push({id:e.id,p:(i+0.5)/by[k].length,ci:ci});});});
    arr.sort(function(a,b){return a.p-b.p||a.ci-b.ci;});ids=arr.map(function(x){return x.id;});}
  ORDER_CACHE={k:ST.set.order,v:ids};return ids;
}

}

  var today=dayIdx(),due=dueIds(),dueCnt=Math.min(due.length,ST.set.maxReviews);
  var quota=+ST.set.newPerDay||20,paused=due.length>=PAUSE_AT;
  var done=(ST.log[today]&&ST.log[today].n)||0;
  var un=unseenIds(),remain=paused?0:Math.max(0,Math.min(quota-done,un.length));

/* ---------- stats ---------- */
function stats(){
  var today=dayIdx(),s={catL:{},total:ENTRIES.length,seen:0,learned:0,diff:0,st:{new:0,learning:0,review:0,mastered:0},box:[0,0,0,0,0],cat:{},ret:null,fc:[0,0,0,0,0,0,0]};
  var retSum=0,retN=0;
  DISPCATS.forEach(function(c){s.cat[c.id]={total:0,new:0,learning:0,review:0,mastered:0};});
  ENTRIES.forEach(function(e){
    var st=status(e.id),c=ST.cards[e.id];
    s.st[st]++;s.cat[P(e.cat)].total++;s.cat[P(e.cat)][st]++;
    if(c&&c.n){s.seen++;if(isLearned(e.id)){s.learned++;s.catL[P(e.cat)]=(s.catL[P(e.cat)]||0)+1;}s.box[clamp((c.b||1)-1,0,4)]++;
      retSum+=Math.exp(-(today-c.last)/(Math.max(c.iv,1)/0.105));retN++;
      var d=Math.max(c.due,today)-today;if(d<7)s.fc[d]++;}
    if(isDifficult(e.id))s.diff++;
  });
  if(retN)s.ret=retSum/retN;
  var r=0,c2=0;for(var k in ST.log){r+=ST.log[k].r;c2+=ST.log[k].c;}
  s.reviews=r;s.acc=r?c2/r:null;
  var streak=0;for(var d=today;d>today-4000;d--){if(ST.log[d]&&ST.log[d].r>0)streak++;else if(d===today)continue;else break;}
  s.streak=streak;
  s.act=[];for(var j=13;j>=0;j--){var l=ST.log[today-j]||{r:0,n:0};s.act.push({d:today-j,r:l.r,n:l.n});}
  return s;
}

/* ---------- prompts ---------- */

    idiom:['বাগ্‌ধারাটির অর্থ কী?','Meaning of this idiom?'],idiomgrp:['এই অর্থের বাগ্‌ধারাগুলো কী?','Idioms with this meaning?'],

}

/* ---------- queues ---------- */
function interleave(ids){
  var b={};ids.forEach(function(id){var c=BYID[id].cat;(b[c]=b[c]||[]).push(id);});
  Object.keys(b).forEach(function(k){shuffle(b[k]);});
  var keys=shuffle(Object.keys(b)),out=[],more=true;
  while(more){more=false;keys.forEach(function(k){if(b[k].length){out.push(b[k].shift());more=true;}});}
  return out;
}

  var tp=todayPlan(),due=tp.dueIds.slice(0,ST.set.maxReviews),nw=tp.newIds.slice();

}

function onDays(ev){
  if(ev.error){cloudErr(ev.error);return;}
  flag(ev,'d');var changed=false,fix=[];
  ev.changes.forEach(function(ch){
    var day=ch.id;
    if(ch.type==='removed'){delete ST.log[day];delete CL.rdays[day];changed=true;return;}
    var r=ch.data||{},pd=CL.pendDay[day]||{},v={},l=ST.log[day];
    DAYF.forEach(function(k){v[k]=(r[k]||0)+(pd[k]||0);});
    if(!CL.first.d&&l){var diff=false;DAYF.forEach(function(k){var m=Math.max(v[k],l[k]||0);if(m!==v[k]){v[k]=m;diff=true;}});if(diff)fix.push(day);}
    CL.rdays[day]=1;ST.log[day]=v;changed=true;
  });
  if(!ev.fromCache&&!CL.first.d){
    CL.first.d=1;
    fix.forEach(function(day){var o=cleanObj(ST.log[day]);o.u=Date.now();CL.ad.setDay(CL.user.uid,day,o).catch(cloudErr);});
    Object.keys(ST.log).forEach(function(day){if(!CL.rdays[day]){var o=cleanObj(ST.log[day]);o.u=Date.now();CL.ad.setDay(CL.user.uid,day,o).catch(cloudErr);}});
  }
  if(changed){save();repaint();}
  paintProfile();
}
function onState(ev){

  if(!ev.fromCache)CL.first.s=1;
  paintProfile();
}

function browseFilter(){
  var q=norm(BR.q),list=[];
  ENTRIES.forEach(function(e,i){
    if(BR.cat!=='all'&&P(e.cat)!==BR.cat)return;
    if(BR.letter&&e._letter!==BR.letter)return;
    if(BR.st!=='all'){if(BR.st==='diff'){if(!isDifficult(e.id))return;}else if(BR.st==='star'){if(!(ST.cards[e.id]&&ST.cards[e.id].star))return;}else if(status(e.id)!==BR.st)return;}
    var sc=0;
    if(q){if(e._hay.indexOf(q)<0)return;sc=e._nq===q?0:e._nq.indexOf(q)===0?1:e._nq.indexOf(q)>0?2:e._na.indexOf(q)>=0?3:4;}
    list.push({e:e,sc:sc,i:i});
  });
  if(q)list.sort(function(a,b){return a.sc-b.sc||a.i-b.i;});
  return list;
}

/* ---------- study session ---------- */
function prepCard(){
  var id=S.queue[S.i],e=BYID[id],dir=ST.set.dir,rev=false;
  if(canRev(e))rev=dir==='reverse'||(dir==='mixed'&&Math.random()<0.5);
  var v=view(e,rev);
  S.cur={id:id,e:e,rev:rev,v:v,start:Date.now(),phase:'q',pick:null,tres:null,recall:'',mc:null,long:false};
  if(S.mode==='mcq')S.cur.mc=buildMcq(e,rev);
  if(S.mode==='type')S.cur.long=!v.items&&norm(v.a).length>24;
}
function allowed(e,v){var s=new Set(VALID[vkey(e,v)]||[]);(v.items?v.items.map(norm):altsOf(v.a)).forEach(function(x){s.add(x);});return s;}
function buildMcq(e,rev){
  var v=view(e,rev),valid=allowed(e,v),correct=v.items?pick(v.items):v.a;
  var pool=ENTRIES.filter(function(x){return x.cat===e.cat&&x.id!==e.id&&(!rev||canRev(x));});
  shuffle(pool);
  var cands=[],seen=new Set([norm(correct)]);
  for(var i=0;i<pool.length&&cands.length<40;i++){
    var v2=view(pool[i],rev),t=v2.items?pick(v2.items):v2.a,n=norm(t);
    if(!n||seen.has(n)||valid.has(n))continue;
    seen.add(n);cands.push(t);
  }
  cands.sort(function(a,b){return Math.abs(a.length-correct.length)-Math.abs(b.length-correct.length)+(Math.random()-0.5)*4;});
  var opts=[{t:correct,ok:true}].concat(cands.slice(0,3).map(function(t){return {t:t,ok:false};}));
  return {opts:shuffle(opts),correct:correct};
}
function checkTyped(e,v,input){
  var x=norm(input);if(!x)return {r:'empty'};
  var al=allowed(e,v);if(al.has(x))return {r:'ok'};
  var res={r:'bad'};
  al.forEach(function(w){if(res.r==='bad'&&w.length>=4&&Math.abs(w.length-x.length)<=1&&lev(w,x)<=1)res={r:'near',w:w};});
  return res;
}
function startSession(mode,ids,o){
  o=o||{};
  if(!ids.length){toast(L('এই সিলেকশনে কোনো শব্দ নেই।','No words match that selection.'));return;}
  S={mode:mode,queue:ids.slice(),i:0,done:new Set(),results:[],t0:Date.now(),from:o.from||'practice',kind:o.kind||'practice',title:o.title||'',finished:false};
  prepCard();route='session';window.scrollTo(0,0);render();
}
function recordFirst(q){
  var c=S.cur;if(S.done.has(c.id))return;
  S.done.add(c.id);applyGrade(c.id,q,Date.now()-c.start,S.kind==='extra');
  S.results.push({id:c.id,q:q,rev:c.rev});
}
function advance(){
  S.i++;if(S.i>=S.queue.length){S.finished=true;render();return;}
  prepCard();window.scrollTo(0,0);render();
}
function rate(q){
  var c=S.cur;recordFirst(q);
  if(q<3&&S.queue.length<S.queue.length+8&&(S.requeued||(S.requeued={}))&&!S.requeued[c.id]){S.requeued[c.id]=1;S.queue.splice(Math.min(S.i+4,S.queue.length),0,c.id);}
  advance();
}

  }else{

    if(ST.set.recall&&c.recall.trim()){var r=checkTyped(c.e,v,c.recall);rc='<div class="res '+(r.r==='ok'?'good':r.r==='near'?'warn':'bad')+'">'+L('আপনার উত্তর: ','Your answer: ')+esc(c.recall)+' — '+(r.r==='ok'?L('মিলেছে','match'):r.r==='near'?L('প্রায় মিলেছে (বানান দেখুন)','close (check spelling)'):L('মেলেনি','no match'))+'</div>';}
    h+='<div class="fc-a">'+rc+backHTML(c,v)+'</div></article>'+rateButtons(c);
  }
  return h;
}
function mcqHTML(){
  var c=S.cur,h=sessionTop()+'<article class="fc">'+cardHead(c)+'<div class="fc-prompt">'+promptOf(c.e.cat,c.rev)+'</div><div class="fc-q">'+esc(c.v.q)+'</div><div class="opts">';
  c.mc.opts.forEach(function(o,i){
    var cls='';if(c.pick!==null){if(o.ok)cls=' good';else if(i===c.pick)cls=' bad';}
    h+='<button class="opt'+cls+'" data-a="pick" data-i="'+i+'"'+(c.pick!==null?' disabled':'')+'><kbd>'+N(i+1)+'</kbd><span>'+esc(o.t)+'</span></button>';
  });
  h+='</div>';
  if(c.pick!==null){
    var ok=c.mc.opts[c.pick].ok;
    h+='<div class="res '+(ok?'good':'bad')+'">'+(ok?L('সঠিক','Correct'):L('ভুল','Not quite'))+'</div><div class="fc-a">'+backHTML(c,c.v)+'</div><div class="row"><button class="btn pri" data-a="next">'+L('পরের','Next')+'</button></div>';
  }
  return h+'</article>';
}
function typeHTML(){
  var c=S.cur,h=sessionTop()+'<article class="fc">'+cardHead(c)+'<div class="fc-prompt">'+promptOf(c.e.cat,c.rev)+(c.v.items?' '+L('(যেকোনো একটি লিখুন)','(type any one)'):'')+'</div><div class="fc-q">'+esc(c.v.q)+'</div>';
  if(!c.tres){
    h+='<div class="fieldset"><input type="text" id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+L('এখানে লিখুন','Type here')+'" aria-label="'+L('উত্তর','Answer')+'"></div><div class="row"><button class="btn pri" data-a="submit">'+L('চেক করুন','Check')+'</button><button class="btn" data-a="skip">'+L('জানি না','Don\'t know')+'</button></div></article>';
  }else{
    var t=c.tres;
    if(c.long)h+='<div class="res warn">'+L('আপনার লেখা: ','You wrote: ')+esc(c.tres.text||'—')+'</div><div class="fc-a">'+backHTML(c,c.v)+'</div></article>'+rateButtons(c);
    else{
      h+='<div class="res '+(t.r==='ok'?'good':t.r==='near'?'warn':'bad')+'">'+(t.r==='ok'?L('সঠিক','Correct'):t.r==='near'?L('প্রায় ঠিক, বানান মিলিয়ে দেখুন','Close, check the spelling'):L('ভুল','Incorrect'))+(t.text?' · '+esc(t.text):'')+'</div><div class="fc-a">'+backHTML(c,c.v)+'</div><div class="row"><button class="btn pri" data-a="next">'+L('পরের','Next')+'</button></div></article>';
    }
  }
  return h;
}
function summaryHTML(){
  var r=S.results,ok=r.filter(function(x){return x.q>=3;}).length,sec=(Date.now()-S.t0)/1000;
  var miss=r.filter(function(x){return x.q<3;});
  var h='<div class="stage"><h1>'+L('শেষ! চমৎকার','Session complete')+'</h1><section class="card lift"><div class="grid g2">'+statTile(L('শব্দ','Words'),N(r.length),'')+statTile(L('সঠিক','Correct'),r.length?N(Math.round(ok/r.length*100))+'%':'—',N(ok)+'/'+N(r.length))+'</div></section>';
  if(miss.length)h+='<section class="card"><h2>'+L('যেগুলো ভুল হয়েছে','Missed')+'</h2><div class="list">'+miss.map(function(m){var e=BYID[m.id];return '<div class="item" style="cursor:default"><div class="l1"><span class="q">'+esc(e.q)+'</span></div><div class="a">'+esc(e.a)+'</div></div>';}).join('')+'</div><div class="row" style="margin-top:12px"><button class="btn pri" data-a="retryMissed">'+L('ভুলগুলো আবার','Retry missed')+'</button></div></section>';
  h+='<div class="row"><button class="btn" data-a="go" data-r="home">'+L('হোমে যান','Back home')+'</button><button class="btn" data-a="go" data-r="practice">'+L('আরও প্র্যাকটিস','More practice')+'</button></div></div>';
  return h;
}
function sessionView(){
  if(S.finished)return summaryHTML();
  var b=S.mode==='flash'?flashHTML():S.mode==='mcq'?mcqHTML():typeHTML();
  return '<div class="stage">'+b+'</div>';
}

/* ---------- render ---------- */
function render(){
  document.documentElement.lang=ST.set.lang==='bn'?'bn':'en';applyTheme();
  document.body.classList.toggle('focus',route==='session'||route==='learn');
  var v;
  switch(route){case 'home':v=homeView();break;case 'today':v=todayView();break;case 'practice':v=practiceView();break;case 'search':v=searchView();break;
    case 'more':v=moreView();break;case 'report':v=reportView();break;case 'prefs':v=prefsView();break;case 'session':v=sessionView();break;case 'learn':v=learnView();break;case 'extra':v=extraView();break;default:v=homeView();}
  document.getElementById('app').innerHTML=headerHTML()+'<main class="wrap">'+v+'</main>';
  var ti=document.getElementById('ti');if(ti)ti.focus();
  var rc=document.getElementById('rc');if(rc)rc.focus();
}

/* ---------- actions ---------- */
var ACT={
  go:function(el){go(el.dataset.r);},
  settings:function(){if(route==='prefs'){go(PREV||'home');}else{PREV=(route==='session'?(S&&S.from):route==='learn'?(UI.learnSrc==='practice'?'practice':'today'):route)||'home';go('prefs');}},
  lang:function(){ST.set.lang=ST.set.lang==='bn'?'en':'bn';save();render();},
  theme:function(){ST.set.theme=effTheme()==='dark'?'light':'dark';save();render();},
  fmt:function(el){UI.fmt=el.dataset.v;render();},
  learn:function(){UI.rev={};UI.learnIds=null;UI.learnSrc='today';go('learn');},
  learnBack:function(){go(learnBackRoute());},
  mark:function(el){setMarks([el.dataset.id],!isMarked(el.dataset.id));var y=window.pageYOffset;render();window.scrollTo(0,y);},
  markAll:function(){var ids=learnIds();setMarks(ids,!ids.every(isMarked));var y=window.pageYOffset;render();window.scrollTo(0,y);},
  lcover:function(){UI.cover=!UI.cover;UI.rev={};var y=window.pageYOffset;render();window.scrollTo(0,y);},
  lrev:function(el){UI.rev[el.dataset.id]=true;var y=window.pageYOffset;render();window.scrollTo(0,y);},
  learnLater:function(){var ids=learnIds();if(!UI.learnIds&&!ids.some(isMarked))setMarks(ids,true);go(learnBackRoute());},
  learnDone:function(){var ids=learnIds(),custom=!!UI.learnIds,m=ids.filter(isMarked);
    if(!m.length){setMarks(ids,true);m=ids.slice();}
    startSession(UI.fmt,m.slice(),{from:learnBackRoute(),kind:custom?'extra':'learn'});},
  extra:function(){go('extra');},
  exAll:function(){UI.ex.cats=[];render();},
  exCat:function(el){var i=UI.ex.cats.indexOf(el.dataset.v);if(i>=0)UI.ex.cats.splice(i,1);else UI.ex.cats.push(el.dataset.v);render();},
  exCount:function(el){UI.ex.count=+el.dataset.v;render();},
  exOrder:function(el){UI.ex.order=el.dataset.v;render();},
  exGo:function(){var pool=extraPool();if(!pool.length){toast(L('এই ক্যাটাগরিতে আর নতুন শব্দ নেই।','No new words left in this selection.'));return;}
    if(UI.ex.order==='rand')pool=shuffle(pool.slice());
    UI.learnIds=pool.slice(0,Math.max(1,UI.ex.count));UI.rev={};UI.marks={};UI.learnSrc='extra';go('learn');},
  startDaily:function(){var q=buildDaily();startSession(UI.fmt,q,{from:'today',kind:'daily'});},
  catAll:function(){UI.cats=[];render();},
  cat:function(el){var i=UI.cats.indexOf(el.dataset.v);if(i>=0)UI.cats.splice(i,1);else UI.cats.push(el.dataset.v);render();},
  scope:function(el){UI.scope=el.dataset.v;render();},
  count:function(el){UI.count=+el.dataset.v;render();},
  wfmt:function(el){UI.weakFmt=el.dataset.v;render();},
  readList:function(){
    var cats=UI.cats.length?UI.cats:DISPCATS.map(function(c){return c.id;});
    var ids=ENTRIES.filter(function(e){if(cats.indexOf(P(e.cat))<0)return false;var st=status(e.id),c=ST.cards[e.id],today=dayIdx();
      if(UI.scope==='due')return c&&c.n&&c.due<=today;if(UI.scope==='new')return st==='new';if(UI.scope==='seen')return st!=='new';return true;}).map(function(e){return e.id;});
    if(!ids.length){toast(L('এই বাছাইয়ে কোনো শব্দ নেই।','No words in this selection.'));return;}
    var ord={};ENTRIES.forEach(function(e,i){ord[e.id]=i;});
    ids=ids.map(function(id,i){return {id:id,n:status(id)==='new'?0:1,i:ord[id]};}).sort(function(x,y){return x.n-y.n||x.i-y.i;}).map(function(x){return x.id;});
    UI.learnIds=ids.slice(0,UI.count).sort(function(x,y){return ord[x]-ord[y];});UI.rev={};UI.marks={};UI.learnSrc='practice';go('learn');
  },
  startPractice:function(el){
    var cats=UI.cats.length?UI.cats:DISPCATS.map(function(c){return c.id;});
    var ids=ENTRIES.filter(function(e){if(cats.indexOf(P(e.cat))<0)return false;var st=status(e.id),c=ST.cards[e.id],today=dayIdx();
      if(UI.scope==='due')return c&&c.n&&c.due<=today;if(UI.scope==='new')return st==='new';if(UI.scope==='seen')return st!=='new';return true;}).map(function(e){return e.id;});
    var q=interleave(ids).slice(0,UI.count);
    startSession(el.dataset.v,q,{from:'practice'});
  },
  weak:function(ev){
    var ids=ENTRIES.filter(function(e){return isWeak(e.id);}).map(function(e){return e.id;});
    ids.sort(function(a,b){var x=ST.cards[a],y=ST.cards[b];return (x.b||1)-(y.b||1);});
    if(!ids.length){toast(L('দুর্বল শব্দ এখনো নেই।','No weak words yet.'));return;}
    startSession(UI.weakFmt,interleave(ids.slice(0,Math.max(UI.count,30))).slice(0,Math.max(UI.count,30)),{from:'practice',kind:'weak'});
  },
  quit:function(){var f=S&&S.from||'practice';S=null;go(f);},
  reveal:function(){var rc=document.getElementById('rc');S.cur.recall=rc?rc.value:'';S.cur.phase='a';render();},
  rate:function(el){rate(+el.dataset.q);},
  pick:function(el){var c=S.cur;if(c.pick!==null)return;c.pick=+el.dataset.i;var ok=c.mc.opts[c.pick].ok,ms=Date.now()-c.start;recordFirst(ok?(ms<3500?5:4):1);render();},
  next:function(){advance();},
  submit:function(){var c=S.cur,ti=document.getElementById('ti'),txt=ti?ti.value:'';if(!norm(txt)){toast(L('আগে কিছু লিখুন।','Type an answer first.'));return;}
    if(c.long){c.tres={r:'self',text:txt};c.phase='a';render();return;}
    var r=checkTyped(c.e,c.v,txt);r.text=txt;if(r.r==='near')r.text=txt;c.tres=r;recordFirst(r.r==='ok'?((Date.now()-c.start)<6000?5:4):r.r==='near'?3:1);render();},
  skip:function(){var c=S.cur;if(c.long){c.tres={r:'self',text:''};c.phase='a';render();return;}c.tres={r:'bad',text:''};recordFirst(1);render();},
  retryMissed:function(){var ids=S.results.filter(function(x){return x.q<3;}).map(function(x){return x.id;});var m=S.mode,f=S.from;S.done=new Set();startSession(m==='match'?'flash':m,ids,{from:f});},
  star:function(el,ev){ev.stopPropagation();var on=toggleStar(el.dataset.id);if(route==='session'||route==='search'||route==='learn'){var y=window.pageYOffset;render();window.scrollTo(0,y);}},
  open:function(el){BR.open=BR.open===el.dataset.id?null:el.dataset.id;var r=document.getElementById('bres');if(r)r.innerHTML=browseListHTML();},
  none:function(){},
  more50:function(){BR.limit+=50;document.getElementById('bres').innerHTML=browseListHTML();},
  letter:function(el){BR.letter=el.dataset.v;BR.limit=50;render();},
  gsignin:function(){if(!CL.ad||CL.busy)return;CL.busy=true;paintProfile();
    CL.ad.signIn().catch(function(e){CL.busy=false;paintProfile();var c=e&&e.code;if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;toast(authMsg(c));});},
  glogAsk:function(){IMP.lo=true;paintProfile();},
  glogNo:function(){IMP.lo=false;paintProfile();},
  glogYes:function(){IMP.lo=false;flushAll();paintProfile();
    waitSynced(function(){CL.ad.signOut().then(function(){resetLocal();ST.owner=null;save();toast(L('লগআউট হয়েছে','Signed out'));render();}).catch(function(){toast(L('লগআউট হয়নি, আবার চেষ্টা করুন।','Could not sign out, try again.'));});});},
  install:function(){if(!DEFER)return;DEFER.prompt();DEFER.userChoice.then(function(){DEFER=null;paintInstall();}).catch(function(){});},
  cloudRetry:function(){cloudInit();paintProfile();},
  resetAsk:function(){IMP.confirm=true;render();},resetNo:function(){IMP.confirm=false;render();},
  resetYes:function(){var uid=CL.user&&CL.user.uid;clearTimeout(CL.tD);clearTimeout(CL.tS);CL.tD=CL.tS=null;CL.pendDay={};resetLocal();if(uid&&CL.ad){ST.owner=uid;CL.remote={};CL.rdays={};save();CL.ad.clearAll(uid).catch(cloudErr);}IMP.confirm=false;toast(L('মুছে ফেলা হয়েছে','Progress erased'));render();}
};
document.addEventListener('click',function(ev){var el=ev.target.closest('[data-a]');if(!el)return;if(el.dataset.a==='none')return;var f=ACT[el.dataset.a];if(f){if(el.tagName==='A')ev.preventDefault();f(el,ev);}});
document.addEventListener('input',function(ev){var t=ev.target;
  if(t.id==='bq'){BR.q=t.value;BR.limit=50;document.getElementById('bres').innerHTML=browseListHTML();}
  if(t.id==='rc'&&S&&S.cur)S.cur.recall=t.value;
  if(t.id==='excount'){var v=Math.round(+t.value);UI.ex.count=clamp(isFinite(v)&&v>0?v:1,1,500);var ei=document.getElementById('exinfo');if(ei)ei.textContent=exInfo();document.querySelectorAll('[data-a=exCount]').forEach(function(b){b.classList.toggle('on',+b.dataset.v===UI.ex.count);});}
  });
document.addEventListener('change',function(ev){var t=ev.target;
  if(t.id==='bcat'){BR.cat=t.value;BR.letter='';BR.limit=50;render();return;}
  if(t.id==='bl'){BR.letter=t.value;BR.limit=50;render();return;}
  if(t.id==='bst'){BR.st=t.value;BR.limit=50;render();return;}
  if(t.dataset&&t.dataset.set){var k=t.dataset.set,v=t.type==='checkbox'?t.checked:t.value;
    if(k==='maxReviews'||k==='newPerDay')v=+v;
    ST.set[k]=v;if(k==='order')ORDER_CACHE.k='';stateDirty();render();}});
document.addEventListener('keydown',function(ev){
  if(route!=='session'||!S||S.finished)return;
  var tg=ev.target&&ev.target.tagName,typing=tg==='TEXTAREA'||tg==='INPUT';
  if(typing){if(ev.key==='Enter'&&tg==='INPUT'&&S.mode==='type'&&S.cur&&!S.cur.tres){ev.preventDefault();ACT.submit();}return;}
  var c=S.cur;if(!c)return;
  if(S.mode==='flash'){if(c.phase==='q'&&(ev.key===' '||ev.key==='Enter')){ev.preventDefault();ACT.reveal();}else if(c.phase==='a'){var m={'1':1,'2':3,'3':4}[ev.key];if(m)rate(m);}}
  else if(S.mode==='mcq'){if(c.pick===null&&/^[1-4]$/.test(ev.key)){ACT.pick({dataset:{i:+ev.key-1}});}else if(c.pick!==null&&ev.key==='Enter'){ev.preventDefault();advance();}}
  else if(S.mode==='type'){if(c.tres&&c.long){var m2={'1':1,'2':3,'3':4}[ev.key];if(m2)rate(m2);}else if(c.tres&&ev.key==='Enter'){ev.preventDefault();advance();}}
});
window.addEventListener('hashchange',function(){var r=fromHash();if(r&&r!==route&&route!=='session'){route=r;render();}});
window.__bcs={ENTRIES:ENTRIES,sched:sched,norm:norm,checkTyped:checkTyped,buildMcq:buildMcq,todayPlan:todayPlan,stats:stats,applyGrade:applyGrade,get ST(){return ST;},go:go,get S(){return S;},ACT:ACT,startSession:startSession,view:view,allowed:allowed};
route=fromHash()||'home';
render();
cloudInit();
})();
</script>
